[workspace]
resolver = "2"
members = ["crates/wisp", "crates/wisp-config", "crates/wisp-probe", "crates/wisp-proto", "crates/wispd", "crates/wisp-hud"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["JDS300"]
repository = "https://github.com/JDS300/wisp"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
